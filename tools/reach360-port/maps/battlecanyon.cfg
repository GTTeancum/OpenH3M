# Per-map choices for converting Battle Canyon (Reach cex_beaver_creek) to Halo 3 360 with tools\ho2h3 from the ElDewrito Reach Advanced Multiplayer
# package (user 2026-11-23: "do a few more"). Slot: deadlock (private test folder). Gameplay stays stock Halo 3.

basis C:\X360\ISOs\H3M\maps\deadlock.map
basis_scenario levels\multi\deadlock\deadlock
scenario levels\dlc\cex_beaver_creek\cex_beaver_creek

# Reach weapons / equipment -> stock Halo 3 (same mandate and table as Reflection)
weapon objects\weapons\rifle\dmr\dmr = objects\weapons\rifle\battle_rifle\battle_rifle
weapon objects\weapons\rifle\shotgun\shotgun = objects\weapons\rifle\shotgun\shotgun
weapon objects\weapons\rifle\sniper_rifle\sniper_rifle = objects\weapons\rifle\sniper_rifle\sniper_rifle
weapon objects\weapons\pistol\needler\needler = objects\weapons\pistol\needler\needler
weapon objects\weapons\melee\energy_sword\energy_sword = objects\weapons\melee\energy_blade\energy_blade
weapon objects\weapons\support_high\rocket_launcher\rocket_launcher = objects\weapons\support_high\rocket_launcher\rocket_launcher
weapon objects\weapons\pistol\magnum\magnum = objects\weapons\pistol\magnum\magnum
weapon objects\weapons\pistol\plasma_pistol\plasma_pistol = objects\weapons\pistol\plasma_pistol\plasma_pistol
weapon objects\weapons\rifle\needle_rifle\needle_rifle = objects\weapons\rifle\covenant_carbine\covenant_carbine
weapon objects\weapons\rifle\focus_rifle\focus_rifle = objects\weapons\rifle\covenant_carbine\covenant_carbine
weapon objects\weapons\rifle\assault_rifle\assault_rifle = objects\weapons\rifle\assault_rifle\assault_rifle
weapon objects\weapons\support_high\plasma_launcher\plasma_launcher = objects\weapons\support_low\brute_shot\brute_shot
weapon objects\weapons\melee\gravity_hammer\gravity_hammer = objects\weapons\melee\gravity_hammer\gravity_hammer
weapon objects\weapons\rifle\plasma_repeater\plasma_repeater = objects\weapons\rifle\plasma_rifle\plasma_rifle
equipment objects\weapons\grenade\plasma_grenade\plasma_grenade = objects\weapons\grenade\plasma_grenade\plasma_grenade
equipment objects\weapons\grenade\frag_grenade\frag_grenade = objects\weapons\grenade\frag_grenade\frag_grenade
equipment objects\multi\powerups\powerup_red\powerup_red = objects\multi\powerups\powerup_red\powerup_red
equipment objects\multi\powerups\powerup_blue\powerup_blue = objects\multi\powerups\powerup_blue\powerup_blue
nofollow scnr:Map Variant Palettes
sandbox Sandbox Vehicles
sandbox Sandbox Weapons
sandbox Sandbox Equipment
sandbox Sandbox Scenery
sandbox Sandbox Teleporters
sandbox Sandbox Goal Objects
sandbox Sandbox Spawning
shadergroup rmgl = rmsh:levels\dlc\sidewinder\shaders\side_hall_glass03

# Battle Canyon standing rules (AGENTS.md): no dice, no Spartan doll, no health stations, no mist/drip emitters; filled in from the package below
# Of the standing Battle Canyon removals, only the dripping-point effect is in the Halo Online package (no dice, doll,
# health stations or ca_bc_mist); the rainbow stays (user 2026-11-03)
remove efsc:levels\dlc\cex_beaver_creek\fx\ca_beaver_dripping_point
