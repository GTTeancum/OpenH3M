# Per-map choices for converting Icebox (Halo Online s3d_turf) to Halo 3 360 with tools\ho2h3 (user 2026-11-23: "And one more. Icebox").
# Source: Halo Online's own base game in the ElDewrito install (read only), not the Reach package.
# Slot: Citadel (fortress; private test folder). Chosen as the smallest stock slot: the converted map must stay under
# the tag memory the game has (see tools\ho2h3\README.md, "tag data size"). Halo Online's tags that exist in stock Halo 3 by name are taken from Halo 3.

ho_pak C:\Games\ElDewrito\maps\tags.dat
basis C:\X360\ISOs\H3M\maps\fortress.map
basis_scenario levels\dlc\fortress\fortress
scenario levels\multi\s3d_turf\s3d_turf

nofollow scnr:Map Variant Palettes
sandbox Sandbox Vehicles
sandbox Sandbox Weapons
sandbox Sandbox Equipment
sandbox Sandbox Scenery
sandbox Sandbox Teleporters
sandbox Sandbox Goal Objects
sandbox Sandbox Spawning

# Camera effects: stock Halo 3 (Citadel's)
object cfxs:levels\multi\s3d_turf\s3d_turf = levels\dlc\fortress\fortress_fx

# Drawn duplicate (2026-11-23): instance 1148 "turf_windows_03" is a merged copy of the window pieces 1149-1159 at the same
# place (195.39 vs 195.4 square units, coplanar coincident triangles). Halo Online draws both at identical depth; in the
# 360 format each piece's vertices are compressed against its own bounds, so the copies fight (user play test: panels
# lose their overlay depending on view angle). The merged copy is left out of the draw lists; its collision stays.
nodraw levels\multi\s3d_turf\s3d_turf 1148

# Overlapping decals left out (user 2026-11-24: "for the overlapping z-fighting decals, can we just remove them?" ... "Do it now").
# ho2h3 decaloverlap: 385 pairs of source decals lie on the same plane with overlapping footprints (decal system radius x
# scale, square). The fewest decals that leave no overlapping pair: 186 of 615 (greedy, most overlaps first). Source decal
