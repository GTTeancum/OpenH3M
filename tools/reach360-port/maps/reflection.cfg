# Per-map choices for porting Reflection (Reach 52_ivory_tower) to Halo 3 360. Read by build_map.sh and
# scenario_sets.py. Lines: <key> <value> or <kind> <reach tag> = <halo 3 tag>. Paths are absolute.
# Conversion steps follow TagTool (tools\reach360-port\README.md, "Documented baseline"); the entries below are inputs,
# not conversion logic: the slot the map replaces, and the user's stock-Halo 3 mandate for weapons / equipment / Forge.

reach_map C:\X360\ISOs\Halo Reach\maps\52_ivory_tower.map
basis C:\X360\ISOs\H3M\maps\guardian.map
basis_scenario levels\multi\guardian\guardian
scenario levels\multi\52_ivory_tower\52_ivory_tower
lightmaps C:\Programming\GitHub\OpenH3M\.local\reflection360\lightmaps

# Reach weapon -> stock Halo 3 weapon (user mandate: weapons, vehicles, equipment, Forge items are stock Halo 3)
weapon objects\weapons\rifle\dmr\dmr = objects\weapons\rifle\battle_rifle\battle_rifle
weapon objects\weapons\rifle\shotgun\shotgun = objects\weapons\rifle\shotgun\shotgun
weapon objects\weapons\rifle\sniper_rifle\sniper_rifle = objects\weapons\rifle\sniper_rifle\sniper_rifle
weapon objects\weapons\pistol\needler\needler = objects\weapons\pistol\needler\needler
weapon objects\weapons\melee\energy_sword\energy_sword = objects\weapons\melee\energy_blade\energy_blade
weapon objects\weapons\support_high\rocket_launcher\rocket_launcher = objects\weapons\support_high\rocket_launcher\rocket_launcher
weapon objects\weapons\pistol\magnum\magnum = objects\weapons\pistol\magnum\magnum
weapon objects\weapons\pistol\plasma_pistol\plasma_pistol = objects\weapons\pistol\plasma_pistol\plasma_pistol
weapon objects\weapons\rifle\needle_rifle\needle_rifle = objects\weapons\rifle\covenant_carbine\covenant_carbine
weapon objects\weapons\rifle\focus_rifle\focus_rifle = objects\weapons\rifle\covenant_carbine\covenant_carbine
weapon objects\weapons\rifle\assault_rifle\assault_rifle = objects\weapons\rifle\assault_rifle\assault_rifle
weapon objects\weapons\support_high\plasma_launcher\plasma_launcher = objects\weapons\support_low\brute_shot\brute_shot
weapon objects\weapons\melee\gravity_hammer\gravity_hammer = objects\weapons\melee\gravity_hammer\gravity_hammer
weapon objects\weapons\rifle\plasma_repeater\plasma_repeater = objects\weapons\rifle\plasma_rifle\plasma_rifle

# Reach equipment -> stock Halo 3 equipment
equipment objects\weapons\grenade\plasma_grenade\plasma_grenade = objects\weapons\grenade\plasma_grenade\plasma_grenade
equipment objects\weapons\grenade\frag_grenade\frag_grenade = objects\weapons\grenade\frag_grenade\frag_grenade
equipment objects\multi\powerups\powerup_red\powerup_red = objects\multi\powerups\powerup_red\powerup_red
equipment objects\multi\powerups\powerup_blue\powerup_blue = objects\multi\powerups\powerup_blue\powerup_blue

# Forge: the Reach palettes are not walked; the basis scenario's stock Halo 3 palettes are shared into the ported scenario
nofollow scnr:Map Variant Palettes
sandbox Sandbox Vehicles
sandbox Sandbox Weapons
sandbox Sandbox Equipment
sandbox Sandbox Scenery
sandbox Sandbox Teleporters
sandbox Sandbox Goal Objects
sandbox Sandbox Spawning

# Reach-only shader group -> stock Halo 3 shader (TagTool's documented default for rmgl)
shadergroup rmgl = rmsh:levels\dlc\sidewinder\shaders\side_hall_glass03

# Props, invisible walls and spawn objects: stock Halo 3 objects (user mandate 2026-11-22: "Stage 2 being Halo 3
# props/objects/invisibles was always the mandate"). object <grp:reach tag> = <halo 3 tag>; matched by name across the
# stock maps (index: .local\reflection360\stock_index\props.txt). Same object kind only; the build copies the stock tag in.
object bloc:objects\gear\human\industrial\crate_multi_single\crate_multi_single = objects\gear\human\industrial\crate_multi_single\crate_multi_single
object bloc:objects\gear\human\industrial\crate_multi\crate_multi = objects\gear\human\military\crate_packing\crate_packing
object bloc:objects\gear\human\industrial\garbage_can\garbage_can = objects\gear\human\industrial\garbage_can\garbage_can
object bloc:objects\gear\human\industrial\street_cone\street_cone = objects\gear\human\industrial\street_cone\street_cone
object bloc:objects\gear\human\military\barricade_large\barricade_large = objects\gear\human\military\barricade_large\barricade_large
object bloc:objects\gear\human\military\barricade_small\barricade_small = objects\gear\human\military\barricade_small\barricade_small
object bloc:objects\gear\human\military\fusion_coil\fusion_coil = objects\gear\human\military\fusion_coil\fusion_coil
object bloc:objects\gear\human\military\hu_mil_radio_big\hu_mil_radio_big_sound_m52 = objects\gear\human\military\hu_mil_radio_big\hu_mil_radio_big_sound
object bloc:objects\multi\nut_blockers\box_m\box_m = objects\multi\box_m\box_m
object bloc:objects\multi\nut_blockers\box_l\box_l = objects\multi\box_l\box_l
object bloc:objects\multi\nut_blockers\box_xl\box_xl = objects\multi\box_xl\box_xl
object bloc:objects\multi\nut_blockers\box_xxl\box_xxl = objects\multi\box_xxl\box_xxl
object bloc:objects\multi\nut_blockers\box_xxxl\box_xxxl = objects\multi\box_xxxl\box_xxxl
object bloc:objects\multi\nut_blockers\wall_s\wall_s = objects\multi\wall_m\wall_m
object bloc:objects\multi\nut_blockers\wall_m\wall_m = objects\multi\wall_m\wall_m
object bloc:objects\multi\nut_blockers\wall_l\wall_l = objects\multi\wall_l\wall_l
object bloc:objects\multi\nut_blockers\wall_xl\wall_xl = objects\multi\wall_xl\wall_xl
object bloc:objects\multi\nut_blockers\wall_xxl\wall_xxl = objects\multi\wall_xxl\wall_xxl
object bloc:objects\multi\nut_blockers\wall_xxxl\wall_xxxl = objects\multi\wall_xxxl\wall_xxxl
object scen:objects\multi\spawning\respawn_point = objects\multi\spawning\respawn_point
object scen:objects\multi\spawning\respawn_point_invisible = objects\multi\spawning\respawn_point_invisible

# Left out (user 2026-11-22: fish removed). Game-mode marker props (flag base, hill beacon, circle, boundary, marker) are
# replaced by the Halo 3 game-mode objects the scenario rules create; Reach-only spawn zones and the cinematic camera
# have no Halo 3 object. Sandbags exist in Halo 3 only as scenery (a different object kind), lift and elevator are
# stage 3: left out until handled.
remove crea:objects\characters\ambient_life\fish_cichlid\fish_cichlid
remove crea:objects\characters\ambient_life\fish_gar_reach\fish_gar_reach
remove crea:objects\characters\ambient_life\fish_koi\fish_koi
remove crea:objects\characters\ambient_life\fish_pirahna\fish_pirahna
remove scen:objects\characters\ambient_life\fish_gar_reach\fish_gar_reach
remove bloc:objects\multi\models\mp_flag_base\mp_flag_base
remove bloc:objects\multi\models\mp_hill_beacon\mp_hill_beacon
remove bloc:objects\multi\models\mp_circle\mp_circle
remove bloc:objects\multi\generic\area_boundary
remove bloc:objects\multi\generic\invisible_marker
remove scen:objects\multi\spawning\initial_spawn_point
remove scen:objects\multi\spawning\respawn_zone
remove scen:objects\multi\spawning\weak_respawn_zone
remove scen:objects\multi\spawning\weak_anti_respawn_zone
remove scen:objects\multi\generic\mp_cinematic_camera
remove bloc:objects\levels\shared\soccer_ball\soccer_ball
remove bloc:objects\gear\human\military\sandbag_wall\sandbag_wall
remove bloc:objects\gear\human\military\sandbag_wall_45corner\sandbag_wall_45corner
remove bloc:objects\gear\human\military\sandbag_wall_90corner\sandbag_wall_90corner
remove bloc:objects\gear\human\military\sandbag_wall_endcap\sandbag_wall_endcap
remove bloc:objects\gear\human\military\sandbag_wall_turret\sandbag_wall_turret
remove bloc:objects\levels\multi\52_ivory_tower\ivorytower_lift\ivorytower_lift
remove mach:objects\levels\shared\device_machines\ivory_tower_elevator\ivory_tower_elevator
# Reach health stations: removed (user 2026-11-22, for Reach -> Halo 3 conversions)
remove ctrl:objects\levels\shared\device_controls\health_station\health_station

# Structure folds (user 2026-11-22, "fold them in"): Halo 3 draws only the camera's structure BSP; Reach draws every
# active one. The outer shell BSP is drawn as instanced geometry of the playable BSP (Fold.cs); it stays loaded for its
# collision. fold <bsp> = <target bsp>
#fold levels\multi\52_ivory_tower\52_ivory_tower_001 = levels\multi\52_ivory_tower\52_ivory_tower_030
#fold levels\multi\52_ivory_tower\52_ivory_tower_000 = levels\multi\52_ivory_tower\52_ivory_tower_030

# Camera effects (exposure / bloom): stock Halo 3 Guardian's. The Halo Online values are Reach's tuning (exposure range
# -1..2, auto brightness one stop up, bloom intensity 0.4 vs stock 0.1) and give heavy glare in Halo 3 (user 2026-11-22
# play test: "flares are strong"). Used by tools\ho2h3\build_map.sh.
object cfxs:levels\multi\52_ivory_tower\post_fx\52_ivory = levels\multi\guardian\guardian
