# Per-map choices for converting Void (ElDewrito Forge canvas levels\eldewrito\canvas\void) to Halo 3 360 with tools\ho2h3 from the ElDewrito Reach Advanced Multiplayer
# package (user 2026-11-23: "do a few more"). Slot: sandbox (private test folder). Gameplay stays stock Halo 3.

basis C:\X360\ISOs\H3M\maps\sandbox.map
basis_scenario levels\dlc\sandbox\sandbox
scenario levels\eldewrito\canvas\void

# Reach weapons / equipment -> stock Halo 3 (same mandate and table as Reflection)
weapon objects\weapons\rifle\dmr\dmr = objects\weapons\rifle\battle_rifle\battle_rifle
weapon objects\weapons\rifle\shotgun\shotgun = objects\weapons\rifle\shotgun\shotgun
weapon objects\weapons\rifle\sniper_rifle\sniper_rifle = objects\weapons\rifle\sniper_rifle\sniper_rifle
weapon objects\weapons\pistol\needler\needler = objects\weapons\pistol\needler\needler
weapon objects\weapons\melee\energy_sword\energy_sword = objects\weapons\melee\energy_blade\energy_blade
weapon objects\weapons\support_high\rocket_launcher\rocket_launcher = objects\weapons\support_high\rocket_launcher\rocket_launcher
weapon objects\weapons\pistol\magnum\magnum = objects\weapons\pistol\magnum\magnum
weapon objects\weapons\pistol\plasma_pistol\plasma_pistol = objects\weapons\pistol\plasma_pistol\plasma_pistol
weapon objects\weapons\rifle\needle_rifle\needle_rifle = objects\weapons\rifle\covenant_carbine\covenant_carbine
weapon objects\weapons\rifle\focus_rifle\focus_rifle = objects\weapons\rifle\covenant_carbine\covenant_carbine
weapon objects\weapons\rifle\assault_rifle\assault_rifle = objects\weapons\rifle\assault_rifle\assault_rifle
