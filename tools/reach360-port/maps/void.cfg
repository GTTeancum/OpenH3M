# Forge World building pieces (user 2026-11-23: "Void is a forge map, so at minimum we need the Forge World objects there").
# Converted from the package's Reach Forge World objects and listed in the Forge menu after Sandbox's own stock pieces.
# Teleporters, man cannons, lifts, lights and doors are gameplay items: those stay stock Halo 3
# (the shared teleporter / goal / spawning / weapon / vehicle / equipment palettes, which hold stock Halo 3 gameplay objects).
forge_palette multiplayer\forge_globals ; \\ff_(?!teleporter_|man_cannon|veh_man_cannon|grav_lift|light_|one_way_door|two_way_door|shield_door|door|dish_door|prisoner_doorblocker) ; SandboxScenery
# Only Forge World pieces in the scenery menu (user 2026-11-23: "I *only* want Forge World objects, not Sandbox's").

# Forge budget as Reach Forge World (forge_halo: 10000 in its scenario and default map variant; user 2026-11-23)
forge_budget 10000
# Forge prices and limits as Reach Forge World (user 2026-11-23: "carry over from forge world"): read from MCC Reach
# forge_halo.map (read only) with ho2h3 reachpal
forge_prices C:\Programming\GitHub\OpenH3M\.local\reference\forge_world_palette.json
