equipment objects\weapons\grenade\plasma_grenade\plasma_grenade = objects\weapons\grenade\plasma_grenade\plasma_grenade
equipment objects\weapons\grenade\frag_grenade\frag_grenade = objects\weapons\grenade\frag_grenade\frag_grenade
