equipment objects\multi\powerups\powerup_blue\powerup_blue = objects\multi\powerups\powerup_blue\powerup_blue
nofollow scnr:Map Variant Palettes
sandbox Sandbox Vehicles
sandbox Sandbox Weapons
sandbox Sandbox Equipment
sandbox Sandbox Teleporters
sandbox Sandbox Goal Objects
sandbox Sandbox Spawning
shadergroup rmgl = rmsh:levels\dlc\sidewinder\shaders\side_hall_glass03

# Void: prototype; changes made for it are listed in tools\ho2h3\README.md (user 2026-11-23: "take liberties with Void, just mark down what you had to change")

# Void prototype liberties (recorded in tools\ho2h3\README.md): the canvas has no floor collision, spawn points or
# objects, so a Forge World platform floor (below), 8 respawn points and 4 stock rifles are placed at the origin.
# place <grp:tag> <x> <y> <z> <yaw degrees> (a stock Halo 3 tag, or a piece converted from the source)
# floor: 4 x 4 Forge World flat 5x5 platforms (20 x 20 m, top at z 1.8), converted from the Reach package
